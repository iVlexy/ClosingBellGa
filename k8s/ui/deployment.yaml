apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: livelyfencing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: localhost:5000/lf-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: livelyfencing
spec:
  selector:
    app: ui
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
